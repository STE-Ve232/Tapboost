version: '3.8'
services:
  postgres:
    image: postgres:13
    container_name: tapboost-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tapboost
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tapboost
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
